name: attested-agent-sandbox

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    # Traces live in memory only: a restart wipes them (./reset-telemetry.sh).
    ports:
      - "16686:16686"   # UI + query API

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Metrics live in memory only (tmpfs instead of the image's on-disk volume),
    # so a restart wipes them (./reset-telemetry.sh) and nothing is written to disk.
    tmpfs:
      - /prometheus
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"     # OTLP/HTTP receiver — what the seeder targets
      - "13133:13133"   # health check

  # The SRE Agent web API + UI. Logs (timings and pass/fail only) show in Docker Desktop.
  # The API key comes from .env at runtime; it is never baked into the image.
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - JAEGER_URL=http://jaeger:16686
      - PROM_URL=http://prometheus:9090
      - OTEL_COLLECTOR_URL=http://otel-collector:4318
      - PROM_OTLP_URL=http://prometheus:9090/api/v1/otlp/v1/metrics
    ports:
      - "3000:3000"
    depends_on:
      - jaeger
      - prometheus
      - otel-collector
