receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/jaeger]
# Metrics bypass the collector: they go OTLP/JSON straight to Prometheus 3's
# native receiver (/api/v1/otlp/v1/metrics, enabled via --web.enable-otlp-receiver).
# The prometheusremotewrite exporter path was flaky here (out-of-order rejections
# on fresh stores) and adds no value for a local demo.
